  presentation:
    title: Presentation
    text: |
      The Bex Music Festival was founded by Robert and Machteld Schrama-Stewart in 2025 to promote young, talented musicians to play in public to gain reognition for their professional skills. Strated in Bex, Vaud, it opened its forst concert in Amsterdam at the famed Ijzerstaven Concert Hall. The Festival promotes all budding young artists to play before large live audiences to gain confidence and recognition. Bi-monthly concerts will be held at La Pelouse Convent and the Bex Temple.

      All interested parties should [contact us](#contact).

