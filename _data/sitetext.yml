fr: &DEFAULT_FR
  header:
    title: Prochain concert le 31/05/2026
    text: Bex Music Festival
#    button: Tell Me More
#    buttonlink: "#services"

  presentation:
    title: Présentation
    text: |
      Le Festival de Musique de Bex a été fondé en 2025 par Robert et Machteld Schrama-Stewart afin de promouvoir des jeunes musiciens talentueux qui souhaitent se produire en public et ainsi se faire connaître pour leurs compétences professionnelles. Le Festival a débuté à Bex, dans le canton de Vaud, et a donné son premier concert à Amsterdam, dans la célèbre salle de concert Ijzerstaven. Le Festival encourage tous les jeunes artistes en herbe à se produire devant un large public afin de gagner en confiance et en notoriété. Des concerts auront lieu tous les deux mois à la Convent de La Pelouse et au Temple de Bex.

      Toutes les personnes intéressées sont invitées à [nous contacter](#contact).

  concert:
    title: "Concerts"
#    text: "Lorem ipsum dolor sit amet consectetur."
    section: concert
