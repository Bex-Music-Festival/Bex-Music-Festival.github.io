      Le festival est ouvert à tous les jeunes dont les interprétations seront aux côtés de professionnels de classe mondiale, afin qu'ils puissent acquérir de l'expérience à leurs côtés. Tous les musiciens locaux de Bex et de l'ensemble du Chablais sont invités à postuler. Le festival s'adresse à tous les publics.
