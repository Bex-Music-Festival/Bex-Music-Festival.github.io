en: &DEFAULT_EN
  header:
#    title: Welcome to our Studio!
    text: Bex Music Festival
#    button: Tell Me More
#    buttonlink: "#services"

  presentation:
    title: Présentation
    text: |
      The festival was established in 2025 by Robert Sandford Stewart to support young musicians.
      
      A premier chamber music festival promoting a new generation of artists bringing a musical experience to the community in the heartland of Vaud. The mission is to establish a premier, community-focused chamber music festival in Bex.
      
      The Rhone Valley and Chablais region boast a vibrant arts community. Our mission is to inspire young locals - in Bex and the surrounding Chablais region along the Rhone Valley from Martigney to Monthey, Ollon, Villars-sur-Ollons, Aigle, Villeneuve, to Vevey and villages - to learn and perform music. By offering diverse educational experiences from classical to jazz, we nurture a new generation of amateur and professional musicians, fostering a lifelong passion for music within our community. 

