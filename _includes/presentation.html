<!-- Presentation -->
<section class="page-section" id="{{ site.data.sitetext[site.locale].presentation.section | default: "presentation" }}">
  <div class="container">
    <div class="row text-center justify-content-center">
      <div class="col-lg-9 text-center">
	<span class="fa-stack fa-4x">
          <i class="fas fa-circle fa-stack-2x text-primary"></i>
          <i class="fas fa-comment fa-stack-1x fa-inverse"></i>
	</span>
	<h4 class="service-heading">{{ site.data.sitetext[site.locale].presentation.title | default: "Presentation" }}</h4>
	<div class="text-muted">{{ site.data.sitetext[site.locale].presentation.text | markdownify }}</div>
      </div>
    </div>
  </div>
</section>
