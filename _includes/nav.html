<!-- Navigation -->
<nav
  class="navbar navbar-expand-lg navbar-dark navbar-page fixed-top"
  id="mainNav"
>
  <div class="container">
    <a class="navbar-brand js-scroll-trigger" href="./">
      <img class="logo" src="/assets/img/bex-music-festival-logo-transparent.svg"/>
    </a>
    <button
      class="navbar-toggler navbar-toggler-right"
      type="button"
      data-toggle="collapse"
      data-target="#navbarResponsive"
      aria-controls="navbarResponsive"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      Menu<i class="fas fa-bars"></i>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav text-uppercase ml-auto">
        {%- for link in site.data.navigation[current_lang].nav -%}
        <li class="nav-item">
          {%- if link.url -%}
          <a class="nav-link js-scroll-trigger" href="{{ link.url }}"
            >{{ link.title }}</a
          >
          {%- elsif link.section -%}
          <a
            class="nav-link js-scroll-trigger"
            href="{{ site.baseurl }}{{lang_prefix}}#{{ link.section }}"
            >{{ link.title }}</a
          >
          {%- else -%}
          <a class="nav-link js-scroll-trigger" href="#">{{ link.title }}</a>
          {%- endif -%}
        </li>
        {%- endfor -%}
        <li class="nav-item">
        {%- if current_lang == "en" -%}
	  <a class="nav-link js-scroll-trigger" href="/">FR</a>
	{%- else -%}
  	  <a class="nav-link js-scroll-trigger" href="/en/">EN</a>
	{%- endif -%}
	</li>
      </ul>
    </div>
  </div>
</nav>
<!-- End Navigation -->
